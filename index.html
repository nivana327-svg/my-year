<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Year</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f2ff;
            color: #30283d;
            text-align: center;
            padding: 40px 20px;
        }

        .card {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 40px;
            margin-bottom: 5px;
        }

        p {
            color: #71687d;
        }

        button {
            border: none;
            background: #8d70c7;
            color: white;
            padding: 14px 22px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #7659ad;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>My Year ✦</h1>

        <p>
            Welcome to your personal glow-up dashboard.
        </p>

        <button onclick="hello()">
            Start my day
        </button>
    </div>

    <script>
        function hello() {
            alert("Okay girl. Let's get to work. 💜");
        }
    </script>

</body>
</html>
